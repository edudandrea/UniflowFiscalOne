services:
  postgres:
    image: postgres:16
    container_name: uniflow-fiscal-one-postgres
    environment:
      POSTGRES_DB: uniflowfiscalone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Elcd@161281
    ports:
      - "5432:5432"
    volumes:
      - uniflow_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uniflowfiscalone"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uniflow_postgres_data:
